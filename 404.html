
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | SpendWise</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .error-page h1 {
      font-size: clamp(70px, 15vw, 130px);
      color: #a3f36b;
    }

    .error-page p {
      color: #94a39a;
      margin: 14px 0 25px;
    }

    .error-page .primary-btn {
      display: inline-block;
      padding: 13px 24px;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="eyebrow">SPENDWISE / ERROR</p>
      <h1>404</h1>
      <h2>Oops! Page not found.</h2>
      <p>The page you're looking for doesn't exist.</p>
      <a class="primary-btn" href="./">Back to Dashboard</a>
    </div>
  </main>
</body>
</html>
